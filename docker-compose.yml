version: '3.8'
name: ${DOCKER_NAME}
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - 8000:80
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: ${DOCKER_NAME}_mysql
    restart: always
    environment:
      MYSQL_DATABASE: edu
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_USER: laravel
      MYSQL_PASSWORD: 123456
    #ports:
    #  - 3306:3306
    volumes:
      - dbdata:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ${DOCKER_NAME}_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: 123456
    ports:
      - 8080:80
    depends_on:
      - db

volumes:
  dbdata:
    name: ${DOCKER_NAME}_dbdata
